# Manual only. Starts when someone runs this workflow by hand.
# No schedule. No pull_request trigger. No sign-in item.
name: check-upstream
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: merge upstream skills and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          powershell -NoProfile -ExecutionPolicy Bypass -File workstation/check-upstream.ps1
