# Test skills/git-checker/hooks/registry-check.py (STALE-OUTPUT content compare, slow fallback) and that
# .github/registry-check.py is a byte-identical copy. Read-only: makes throwaway repos in a temp folder.
name: registry-check-test

on:
  pull_request:
    paths:
      - 'skills/git-checker/hooks/registry-check.py'
      - '.github/registry-check.py'
      - 'scripts/test_registry_check.py'
      - '.github/workflows/registry-check-test.yml'
  push:
    branches: [main]
    paths:
      - 'skills/git-checker/hooks/registry-check.py'
      - '.github/registry-check.py'
      - 'scripts/test_registry_check.py'
      - '.github/workflows/registry-check-test.yml'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version-file: .python-version
      - name: Test registry-check.py
        run: python3 scripts/test_registry_check.py
