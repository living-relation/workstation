# Rebuild skills/<name>.zip when skill folders change. Never pushes to main.
# Same-repo PRs: commit changed zips back onto the PR branch.
# Push to main / workflow_dispatch: if zips are stale, open or update a PR.
# Retrigger guards: paths exclude **/*.zip, skip github-actions[bot] and [skip ci],
# and GITHUB_TOKEN events do not start new workflow runs.
name: pack-skill-zips
on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '!**/*.zip'
      - 'scripts/pack-skill-zips.py'
      - 'scripts/pack-skill-zips.sh'
      - 'scripts/pack-skill-zips.ps1'
      - 'scripts/pack-skill-zips-commit.sh'
      - 'scripts/test_pack_skill_zips.py'
      - '.github/workflows/pack-skill-zips.yml'
  pull_request:
    paths:
      - 'skills/**'
      - '!**/*.zip'
      - 'scripts/pack-skill-zips.py'
      - 'scripts/pack-skill-zips.sh'
      - 'scripts/pack-skill-zips.ps1'
      - 'scripts/pack-skill-zips-commit.sh'
      - 'scripts/test_pack_skill_zips.py'
      - '.github/workflows/pack-skill-zips.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pack-skill-zips-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  on-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.13'
      - name: install pyyaml
        run: pip install 'pyyaml==6.0.2'
      - name: skip if paused
        id: enabled
        run: |
          en=$(python3 .github/registry-check.py --enabled pack-skill-zips)
          echo "value=$en" >> "$GITHUB_OUTPUT"
          echo "pack-skill-zips enabled: $en"
      - name: skip [skip ci] head commit
        if: steps.enabled.outputs.value == 'true'
        id: skipci
        run: |
          if git log -1 --format=%B | grep -Fq '[skip ci]'; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "head commit has [skip ci]; not committing"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - name: test packer
        if: steps.enabled.outputs.value == 'true'
        run: python3 scripts/test_pack_skill_zips.py
      - name: rebuild and commit zips onto this PR branch
        if: steps.enabled.outputs.value == 'true' && steps.skipci.outputs.value != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/pack-skill-zips.py
          before=$(git rev-parse HEAD)
          bash scripts/pack-skill-zips-commit.sh
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

  on-main:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.13'
      - name: install pyyaml
        run: pip install 'pyyaml==6.0.2'
      - name: skip if paused
        id: enabled
        run: |
          en=$(python3 .github/registry-check.py --enabled pack-skill-zips)
          echo "value=$en" >> "$GITHUB_OUTPUT"
          echo "pack-skill-zips enabled: $en"
      - name: test packer
        if: steps.enabled.outputs.value == 'true'
        run: python3 scripts/test_pack_skill_zips.py
      - name: open or update a PR if zips are stale
        if: steps.enabled.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          bot=chore/skill-zips
          git fetch origin main
          python3 scripts/pack-skill-zips.py
          stale=0
          git diff --quiet -- 'skills/*.zip' || stale=1
          if [ -n "$(git ls-files --others --exclude-standard -- 'skills/*.zip')" ]; then stale=1; fi
          if [ "$stale" -eq 0 ]; then
            echo 'Zips on this commit are current; no PR'
            exit 0
          fi
          git reset --hard HEAD
          git clean -f -- skills
          open=$(gh pr list --base main --head "$bot" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            git fetch origin "$bot"
            git checkout -B "$bot" "origin/$bot"
            git merge --no-edit origin/main
            python3 scripts/pack-skill-zips.py
            bash scripts/pack-skill-zips-commit.sh
            git push origin "$bot"
            echo "Updated existing PR #$open"
            exit 0
          fi
          git checkout -B "$bot" origin/main
          python3 scripts/pack-skill-zips.py
          bash scripts/pack-skill-zips-commit.sh
          if git diff --quiet origin/main -- 'skills/*.zip'; then
            echo 'Zips on main are current; no PR'
            exit 0
          fi
          if git push -u origin "$bot"; then
            :
          else
            bot="chore/skill-zips-${GITHUB_RUN_ID}"
            git checkout -B "$bot"
            git push -u origin "$bot"
          fi
          gh pr create --base main --head "$bot" \
            --title 'chore(skills): rebuild Claude-importable zips' \
            --body 'Automated rebuild of `skills/<name>.zip`. The Action never pushes to main. Do not edit the zips by hand.'
