# Pins and pointers only. Nothing listed here is copied into this repo.
# "TBD" = not pinned yet (see the open items at the bottom).
# No CAD tools here (rule 2026-10-21): FreeCAD, the sim packages (CalculiX, Gmsh, ParaView, OpenFOAM, Elmer), Fusion 360,
# the CAD MCPs and the models folder are pinned in handbuilt-cad/cad-tools.lock.yaml and set up by its setup.sh / setup.ps1.
schema: 1
repos:
  handbuilt-cad:
    url: https://github.com/living-relation/handbuilt-cad.git
    ref: main           # FOLLOWS main: clone main, later updates are `git pull --ff-only` after a merge (no sha pin)
    commit: follow      # not pinned on purpose: a sha pin went stale on every handbuilt-cad PR. Pin a sha here only for a
                        # frozen install (then set ref to that sha and say why); see README "handbuilt-cad follows main"
    last_checked: c6dae5c4   # informational only: handbuilt-cad main checked with this workstation on 2026-10-17 (after PR #6)
    path: "{wsl_projects}/handbuilt-cad"
    setup: setup.sh     # builds the repo's own .venv from its uv.lock
upstream:
  uv:
    version: 0.13.0
    linux_x64: { url: https://github.com/astral-sh/uv/releases/download/0.13.0/uv-x86_64-unknown-linux-gnu.tar.gz, sha256: 1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154 }
    windows_x64: { url: https://github.com/astral-sh/uv/releases/download/0.13.0/uv-x86_64-pc-windows-msvc.zip, sha256: 088962f9e7b7bd9ea740c04c650b2a21c8928c345bd99ac24350dc924dba656c }
  gitleaks:
    version: 8.30.1
    linux_x64: { sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb }
    windows_x64: { sha256: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e }
  desktop_commander: { version: latest, via: "npx @wonderwhy-er/desktop-commander@latest" }  # FOLLOWS latest on purpose (remote start, workstation\desktop-commander-remote); pin a version here to freeze it
  python_wsl: { version: 3.13.16, via: uv }
outside_dependencies:   # listed here only; never installed, built or copied by this repo
  windows-mcp:
    package: windows-mcp
    version: 0.8.8        # proposed: latest on PyPI 2026-10-17; confirm the installed version before pinning
    run: "uvx windows-mcp@0.8.8 serve --transport stdio"
patches: []
skills:
  - { from: repos.handbuilt-cad, dir: skills }   # reference only: CAD skills live in the handbuilt-cad clone; install.ps1 links them (link-skills.ps1)
  - { from: self, dir: skills }
open_items:
  - windows-mcp installed version
