<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project dashboard</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header id="topbar">
    <div class="tb-row">
      <div class="tb-title">Projects<small>Workstation dashboard</small></div>
      <div class="tb-spacer"></div>
      <div class="tb-meta" id="stamp">Loading…</div>
      <button type="button" class="btn-refresh" id="refresh">Refresh</button>
    </div>
    <nav class="tb-nav" id="nav"></nav>
  </header>
  <main id="app">
    <div id="tiles" class="tiles"></div>
    <section class="section" id="ws-section">
      <div class="section-hd">
        <div class="topic-icon" style="background:var(--ink)">W</div>
        <h2>Workstation</h2>
        <span class="sub">Toggles, health and shortcuts on this PC</span>
      </div>
      <div class="section-bd">
        <div id="alerts"></div>
        <div id="toggles"></div>
        <div id="shortcuts"></div>
      </div>
    </section>
    <div id="board"></div>
  </main>
  <dialog id="checkout">
    <div class="light-bar">
      <strong id="checkout-title"></strong>
      <button type="button" id="checkout-close">Close</button>
    </div>
    <pre id="checkout-body"></pre>
  </dialog>
  <dialog id="light">
    <div class="light-bar">
      <strong id="light-title"></strong>
      <span>
        <button type="button" id="light-open">Open file</button>
        <button type="button" id="light-close">Close</button>
      </span>
    </div>
    <div id="light-body"></div>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>
