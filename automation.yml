# automation.yml: every script, hook and job in this repo, grouped by tool (format: skills/git-checker).
# Check it (read-only): python skills/git-checker/hooks/registry-check.py
# state-check only posts a PR comment. pack-skill-zips auto-commits skills/*.zip onto PR
# branches (never main, never if PR head is main; if main is stale it resets chore/skill-zips
# and force-with-lease that bot branch only). Only gen-inventory writes a tracked file by hand.
# trigger: manual | git-hook:<name> | agent-hook:<event> | called-by:<id>. "(inferred)" = read from the code, not run.
generated_patterns: ["**/*.checks.json", "**/*_report.json", "**/*.pdf", "**/*.html", "**/*.xlsx", "skills/*.zip"]
ignore: ["**/tests/**", "**/test_*.py"]
handmade: ["workstation/dashboard/static/*.html"]
automations:
  - id: state-check
    script: .github/workflows/state-check.yml
    helpers: [.github/state-check.sh, .github/registry-check.py]
    trigger: pr-check
    reads: [PR diff and body, .state-check-mode, automation.yml]
    writes: [PR comment only]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: bash .github/state-check.sh origin/main HEAD
  - id: hook-pre-commit
    script: .githooks/pre-commit
    helpers: [scripts/guard-staged.sh, scripts/run-gitleaks.sh]
    trigger: git-hook:pre-commit
    reads: [staged changes, .gitleaks-version, .gitleaks.toml, .tools/gitleaks]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: sh .githooks/pre-commit
  - id: hook-pre-merge-commit
    script: .githooks/pre-merge-commit
    helpers: [scripts/guard-staged.sh, scripts/run-gitleaks.sh]
    trigger: git-hook:pre-merge-commit
    reads: [staged changes, .gitleaks-version, .gitleaks.toml, .tools/gitleaks]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
  - id: setup
    script: [setup.ps1, setup.sh]
    helpers: [scripts/fetch-gitleaks.sh]
    trigger: manual
    reads: [.gitleaks-version, pyproject.toml, uv.lock, local.toml.example]
    writes: [.tools/**, .venv/**, local.toml, git config core.hooksPath]
    committed: gitignored
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1
  - id: gen-inventory
    script: scripts/gen-inventory.py
    trigger: manual
    reads: [workstation.lock.yaml]
    writes: [INVENTORY.md]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: .venv/bin/python scripts/gen-inventory.py
  - id: install
    script: install.ps1
    helpers: [preflight.ps1, ownership-notes.ps1, link-skills.ps1, workstation/shortcuts/install-shortcuts.ps1, workstation/shortcuts/install.ps1, install.cmd, claude/claude-setup.ps1, claude/mcp-servers.json, claude/plugins.json]
    trigger: manual
    reads: [toolkit.psd1, memory/templates/**, instructions/**, handoff/**, memory/hooks/**, skills/**, claude/**]
    writes: [outside the repo (inferred) - LOCALAPPDATA Workstation folder, user .claude settings and hooks, user .claude.json MCP servers, Projects _claude store, shortcuts/*.lnk]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -WhatIf
  - id: install-admin
    script: install-admin.ps1
    trigger: manual
    reads: [LOCALAPPDATA Workstation config (inferred)]
    writes: [Windows scheduled tasks (inferred)]
    committed: no
    auto_commit: false
    enabled: true
  - id: uninstall
    script: uninstall.ps1
    trigger: manual
    reads: [Projects _claude automation-installed-files.txt]
    writes: [removes only what install.ps1 recorded]
    committed: no
    auto_commit: false
    enabled: true
  - id: memory-link-guard
    script: memory/hooks/memory-link-guard.ps1
    helpers: [memory/hooks/tests/test-memory-link-guard-progress.ps1, memory/hooks/tests/test-memory-link-guard-worktree.ps1]
    trigger: agent-hook:SessionStart+PreToolUse (installed copy, by install)
    reads: [user .claude settings, memory junction]
    writes: [memory junction and project memory folders (outside the repo)]
    committed: no
    auto_commit: false
    enabled: true
  - id: handoff-hooks
    script: [handoff/claude/context-guard.ps1, handoff/claude/pr-closeout-nudge.ps1, handoff/cursor/handoff-at-80.py]
    helpers: [handoff/claude/tests/test-pr-closeout-nudge.ps1]
    trigger: agent-hook:statusLine+Stop+PreCompact+PostToolUse (installed copies, by install)
    reads: [agent session context usage; PostToolUse payload for pr-closeout-nudge]
    writes: [handoff backups outside the repo (inferred); no files for pr-closeout-nudge]
    committed: no
    auto_commit: false
    enabled: true
  - id: claude-setup
    script: claude/claude-setup.ps1
    helpers: [claude/mcp-servers.json, claude/plugins.json, claude/tests/test-claude-setup.ps1]
    trigger: called-by:install
    reads: [claude/mcp-servers.json, claude/plugins.json, user .claude.json]
    writes: [user .claude.json MCP servers (merge); Claude Code plugins via claude plugin install]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File claude/tests/test-claude-setup.ps1
  - id: workstation-shortcuts
    script: [workstation/shortcuts/workers-start.ps1, workstation/shortcuts/workers-stop.ps1, workstation/shortcuts/workstation-status.ps1, workstation/shortcuts/dashboard.ps1, workstation/shortcuts/pull.ps1, pull.cmd, workstation/shortcuts/rc-generate.ps1, workstation/shortcuts/rc-open.ps1, workstation/shortcuts/rc-close.ps1]
    helpers: [workstation/shortcuts/workstation-common.ps1, workstation/shortcuts/claude-auth-status.ps1, workstation/shortcuts/tests/test-claude-auth-status.ps1, workstation/shortcuts/rc-lib.ps1, workstation/shortcuts/tests/test-rc-shortcuts.ps1, workstation/paths.ps1, workstation/repo-status.ps1, workstation/repo-branch.ps1]
    trigger: manual
    reads: [LOCALAPPDATA Workstation workstation.json, project repos (read-only status)]
    writes: [LOCALAPPDATA Workstation stop flag and logs; pull.cmd/pull.ps1 fast-forward this clone only; shortcuts/rc/*.lnk gitignored from rc-generate.ps1]
    committed: no
    auto_commit: false
    enabled: true
  - id: cursor-worker
    script: workstation/cursor-worker/run-worker.ps1
    helpers: [workstation/cursor-worker/config.ps1, workstation/cursor-worker/health-check.ps1, workstation/cursor-worker/repair-sqlite.ps1]
    trigger: called-by:workstation-shortcuts
    reads: [Cursor agent CLI]
    writes: [LOCALAPPDATA Workstation cursor-worker logs, state and sqlite cache]
    committed: no
    auto_commit: false
    enabled: true
  - id: dashboard
    script: workstation/dashboard/start-dashboard.ps1
    helpers: [workstation/dashboard/server.py, workstation/dashboard/collect.py, workstation/dashboard/send.py, workstation/dashboard/make_phone_qr.py, workstation/dashboard/test_parse.py, workstation/dashboard/test_phone_cookie.py, workstation/dashboard/test_toggle_api.py]
    trigger: called-by:workstation-shortcuts
    reads: [Projects active folder, running Claude/Cursor processes]
    writes: [local web page only; runtime files under LOCALAPPDATA Workstation (inferred)]
    committed: no
    auto_commit: false
    enabled: true
  - id: toggles
    script: workstation/toggles/toggle.ps1
    helpers: [workstation/toggles/toggles.py, workstation/toggles/check-http.ps1, workstation/toggles/python.ps1, workstation/toggles/remote.ps1, workstation/toggles/stop-port.ps1, workstation/toggles/watcher.ps1, workstation/toggles/watcher.py, workstation/toggles/test_toggles.py]
    trigger: called-by:dashboard
    reads: [toggle state, local ports and processes]
    writes: [starts/stops local services; state under LOCALAPPDATA Workstation (inferred)]
    committed: no
    auto_commit: false
    enabled: true
  - id: dc-remote
    script: [workstation/desktop-commander-remote/start-dc-remote.ps1, workstation/desktop-commander-remote/stop-dc-remote.ps1]
    trigger: called-by:toggles
    reads: [pinned Desktop Commander version]
    writes: [LOCALAPPDATA Workstation desktop-commander-remote logs]
    committed: no
    auto_commit: false
    enabled: true
  - id: tracker
    script: workstation/tracker/tracker.ps1
    helpers: [workstation/tracker/tracker-common.ps1, workstation/tracker/tracker-window.ps1]
    trigger: manual
    reads: [agent task state (inferred)]
    writes: [on-screen window only (inferred)]
    committed: no
    auto_commit: false
    enabled: true
  - id: skill-tools
    script: [skills/git-checker/git-checker.ps1, skills/git-checker/git-checker.sh, skills/git-checker/hooks/registry-check.py, skills/git-checker/hooks/state-check.sh, skills/iterative-cleaning/refcheck.py]
    trigger: manual
    reads: [the repo they are run in (read-only)]
    writes: [report to the console; registry-check --set edits automation.yml]
    committed: no
    auto_commit: false
    enabled: true
  - id: fusion-lock
    script: workstation/fusion-lock/fusion-lock.ps1
    helpers: [workstation/fusion-lock/tests/test-fusion-lock.ps1, workstation/paths.ps1]
    trigger: manual
    reads: [LOCALAPPDATA Workstation fusion.lock, AutodeskFusionMCP add-in at 127.0.0.1:8765 (read-only document list, check only)]
    writes: [LOCALAPPDATA Workstation fusion.lock and fusion-lock.log; hidden pinger process (acquire -StartPinger)]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File workstation/fusion-lock/fusion-lock.ps1 status
  - id: pack-skill-zips
    script: .github/workflows/pack-skill-zips.yml
    helpers: [scripts/pack-skill-zips.py, scripts/pack-skill-zips.sh, scripts/pack-skill-zips.ps1, scripts/pack-skill-zips-commit.sh, scripts/guard-staged.sh, scripts/fetch-gitleaks.sh, scripts/run-gitleaks.sh]
    trigger: pr-check
    reads: [skills/**, scripts/pack-skill-zips.py]
    writes: [skills/*.zip]
    committed: yes
    auto_commit: true
    enabled: true
    run_cmd: python3 scripts/pack-skill-zips.py --strict
