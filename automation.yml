# automation.yml: every script, hook and job in this repo, grouped by tool (format: skills/git-checker).
# Check it (read-only): python skills/git-checker/hooks/registry-check.py
# state-check only posts a PR comment. pack-skill-zips auto-commits skills/*.zip onto PR
# branches (never main, never if PR head is main; if main is stale it resets chore/skill-zips
# and force-with-lease that bot branch only). Only gen-inventory writes a tracked file by hand.
# trigger: manual | git-hook:<name> | agent-hook:<event> | called-by:<id>. "(inferred)" = read from the code, not run.
generated_patterns: ["**/*.checks.json", "**/*_report.json", "**/*.pdf", "**/*.html", "**/*.xlsx", "skills/*.zip"]
ignore: ["**/tests/**", "**/test_*.py"]
handmade: []
automations:
  - id: state-check
    script: .github/workflows/state-check.yml
    helpers: [.github/state-check.sh, .github/registry-check.py]
    trigger: pr-check
    reads: [PR diff and body, .state-check-mode, automation.yml]
    writes: [PR comment only]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: bash .github/state-check.sh origin/main HEAD
  - id: hook-pre-commit
    script: .githooks/pre-commit
    helpers: [scripts/guard-staged.sh, scripts/run-gitleaks.sh]
    trigger: git-hook:pre-commit
    reads: [staged changes, .gitleaks-version, .gitleaks.toml, .tools/gitleaks]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: sh .githooks/pre-commit
  - id: hook-pre-merge-commit
    script: .githooks/pre-merge-commit
    helpers: [scripts/guard-staged.sh, scripts/run-gitleaks.sh]
    trigger: git-hook:pre-merge-commit
    reads: [staged changes, .gitleaks-version, .gitleaks.toml, .tools/gitleaks]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
  - id: setup
    script: [setup.ps1, setup.sh]
    helpers: [scripts/fetch-gitleaks.sh]
    trigger: manual
    reads: [.gitleaks-version, pyproject.toml, uv.lock, local.toml.example]
    writes: [.tools/**, .venv/**, local.toml, git config core.hooksPath]
    committed: gitignored
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1
  - id: gen-inventory
    script: scripts/gen-inventory.py
    trigger: manual
    reads: [workstation.lock.yaml]
    writes: [INVENTORY.md]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: .venv/bin/python scripts/gen-inventory.py
  - id: install
    script: install.ps1
    helpers: [preflight.ps1, ownership-notes.ps1, link-skills.ps1, workstation/make-shortcuts.ps1, install.cmd, claude/claude-setup.ps1, claude/mcp-servers.json, claude/plugins.json, cleanup-legacy.ps1]
    trigger: manual
    reads: [toolkit.psd1, memory/templates/**, instructions/**, handoff/**, memory/hooks/**, skills/**, claude/**]
    writes: [outside the repo (inferred) - LOCALAPPDATA Workstation folder, user .claude settings and hooks, user .claude.json MCP servers, Projects _claude store, manual shortcuts/*.lnk]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -WhatIf
  - id: uninstall
    script: uninstall.ps1
    trigger: manual
    reads: [Projects _claude automation-installed-files.txt]
    writes: [removes only what install.ps1 recorded]
    committed: no
    auto_commit: false
    enabled: true
  - id: memory-link-guard
    script: memory/hooks/memory-link-guard.ps1
    helpers: [memory/hooks/tests/test-memory-link-guard-progress.ps1, memory/hooks/tests/test-memory-link-guard-worktree.ps1, memory/hooks/tests/test-memory-link-guard-cursor.ps1, hooks/tests/test-state-memory-link-guard.ps1]
    trigger: agent-hook:SessionStart+PreToolUse (installed copy, by install)
    reads: [WORKSTATION_MEMORY_STORE, user .claude settings, autoMemoryDirectory junction]
    writes: [autoMemoryDirectory junction and project memory folders (outside the repo)]
    committed: no
    auto_commit: false
    enabled: true
  - id: handoff-hooks
    script: [handoff/claude/context-guard.ps1, handoff/claude/pr-closeout-nudge.ps1, handoff/cursor/handoff-at-80.py]
    helpers: [handoff/claude/tests/test-pr-closeout-nudge.ps1, handoff/claude/tests/test-state-closeout-trigger.ps1]
    trigger: agent-hook:statusLine+Stop+PreCompact+PostToolUse (installed copies, by install)
    reads: [agent session context usage; PostToolUse payload for pr-closeout-nudge]
    writes: [handoff backups outside the repo (inferred); no files for pr-closeout-nudge]
    committed: no
    auto_commit: false
    enabled: true
  - id: claude-setup
    script: claude/claude-setup.ps1
    helpers: [claude/mcp-servers.json, claude/plugins.json, claude/tests/test-claude-setup.ps1]
    trigger: called-by:install
    reads: [claude/mcp-servers.json, claude/plugins.json, user .claude.json]
    writes: [user .claude.json MCP servers (merge); Claude Code plugins via claude plugin install]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File claude/tests/test-claude-setup.ps1
  - id: health-check
    script: workstation/health/workstation-status.ps1
    helpers: [workstation/health/workstation-common.ps1, workstation/health/claude-auth-status.ps1, workstation/health/orphans.ps1, workstation/health/tests/test-claude-auth-status.ps1, workstation/health/tests/test-app-locks.ps1, workstation/health/tests/test-health-clean.ps1, workstation/cursor-worker/cursor-worker-lib.ps1, workstation/paths.ps1, workstation/repo-status.ps1, workstation/repo-branch.ps1]
    trigger: manual
    reads: [LOCALAPPDATA Workstation workstation.json, user .claude settings, skill links, app-lock rule files]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File workstation/health/workstation-status.ps1 -NoPause
  - id: dc-remote
    script: [workstation/desktop-commander-remote/start-dc-remote.ps1, workstation/desktop-commander-remote/stop-dc-remote.ps1, workstation/desktop-commander-remote/dc-remote-status.ps1]
    helpers: [workstation/desktop-commander-remote/dc-remote-lib.ps1, workstation/desktop-commander-remote/tests/test-dc-remote.ps1, workstation/kill-orphans.ps1]
    trigger: manual
    reads: [running Desktop Commander remote processes]
    writes: [LOCALAPPDATA Workstation desktop-commander-remote logs, LOCALAPPDATA Workstation kill-orphans.log]
    committed: no
    auto_commit: false
    enabled: true
  - id: cursor-worker
    script: [workstation/cursor-worker/start-cursor-worker.ps1, workstation/cursor-worker/stop-cursor-worker.ps1]
    helpers: [workstation/cursor-worker/cursor-worker-lib.ps1, workstation/cursor-worker/tests/test-cursor-worker.ps1]
    trigger: manual
    reads: [folders in the detected Projects active directory, Cursor CLI on PATH, processes this tool started]
    writes: [LOCALAPPDATA Workstation cursor-worker logs and instance notes]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File workstation/cursor-worker/tests/test-cursor-worker.ps1
  - id: cleanup-legacy
    script: cleanup-legacy.ps1
    trigger: manual
    reads: [user .claude settings.json, LOCALAPPDATA Workstation old runtime folders, clone shortcuts folder]
    writes: [LOCALAPPDATA Workstation backups/cleanup-legacy archive and HASHES.txt]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File cleanup-legacy.ps1 -WhatIf
  - id: skill-tools
    script: [skills/git-checker/git-checker.ps1, skills/git-checker/git-checker.sh, skills/git-checker/hooks/registry-check.py, skills/git-checker/hooks/state-check.sh, skills/iterative-cleaning/refcheck.py]
    trigger: manual
    reads: [the repo they are run in (read-only)]
    writes: [report to the console; registry-check --set edits automation.yml]
    committed: no
    auto_commit: false
    enabled: true
  - id: fusion-lock
    script: workstation/fusion-lock/fusion-lock.ps1
    helpers: [workstation/fusion-lock/tests/test-fusion-lock.ps1, workstation/fusion-lock/tests/test-harness-lock.ps1, workstation/paths.ps1]
    trigger: manual
    reads: [LOCALAPPDATA Workstation fusion.lock (default) or harness-design.lock (-Name harness-design), AutodeskFusionMCP add-in at 127.0.0.1:8765 (Fusion check only), harness.design.exe window titles (harness.design check only)]
    writes: [LOCALAPPDATA Workstation fusion.lock and fusion-lock.log by default; harness-design.lock and harness-design-lock.log when -Name harness-design; hidden pinger process (acquire -StartPinger)]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File workstation/fusion-lock/fusion-lock.ps1 status
  - id: check-upstream
    script: workstation/check-upstream.ps1
    helpers: [.github/workflows/check-upstream.yml, workstation/tests/test-check-upstream.ps1]
    trigger: manual
    reads: [skills/**]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File workstation/check-upstream.ps1 -WhatIf
  - id: skills-drift
    script: workstation/skills-drift.ps1
    helpers: [workstation/tests/test-skills-drift.ps1]
    trigger: manual
    reads: [skills/**, the claude.ai synced skill folders under the user profile]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File workstation/skills-drift.ps1 -NoPause
  - id: pack-skill-zips
    script: .github/workflows/pack-skill-zips.yml
    helpers: [scripts/pack-skill-zips.py, scripts/pack-skill-zips.sh, scripts/pack-skill-zips.ps1, scripts/pack-skill-zips-commit.sh, scripts/guard-staged.sh, scripts/fetch-gitleaks.sh, scripts/run-gitleaks.sh]
    trigger: pr-check
    reads: [skills/**, scripts/pack-skill-zips.py]
    writes: [skills/*.zip]
    committed: yes
    auto_commit: true
    enabled: true
    run_cmd: python3 scripts/pack-skill-zips.py --strict
  - id: projects-root-hooks
    script: [hooks/projects-root-guard.ps1, hooks/projects-root-report.ps1]
    helpers: [hooks/projects-root-common.ps1, hooks/tests/test-projects-root-guard.ps1, hooks/hooks.json, hooks/cursor-hooks.json]
    trigger: agent-hook:PreToolUse+Stop (Claude hooks/hooks.json; Cursor hooks/cursor-hooks.json)
    reads: [tool payload on stdin, WORKSTATION_PROJECTS_ROOT, WORKSTATION_PROJECTS_DENY_KEYWORDS, the detected projects root]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File hooks/tests/test-projects-root-guard.ps1
  - id: agents-md-only-warn
    script: hooks/agents-md-only-warn.ps1
    helpers: [hooks/tests/test-agents-md-only-warn.ps1, hooks/hooks.json]
    trigger: agent-hook:SessionStart (Claude hooks/hooks.json only; no Cursor hook, pending decision C1)
    reads: [session cwd from stdin, parent directories up to the drive root]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File hooks/tests/test-agents-md-only-warn.ps1
  - id: state-hooks
    script: [hooks/state-inject.ps1, hooks/state-lint-stop.ps1, hooks/protected-files-guard.ps1]
    helpers: [hooks/state-common.ps1, hooks/hooks.json, hooks/cursor-hooks.json, hooks/tests/state-test-support.ps1, hooks/tests/test-state-inject.ps1, hooks/tests/test-state-lint-stop.ps1, hooks/tests/test-state-protected-files-guard.ps1]
    trigger: agent-hook:SessionStart+Stop+PreToolUse (Claude hooks/hooks.json; Cursor hooks/cursor-hooks.json preToolUse+stop)
    reads: [hook payload on stdin, WORKSTATION_MEMORY_STORE, WORKSTATION_STATE_TOOLS, STATE.md and STATE-*.md in the memory store project folder (outside the repo), SPEC files, VERIFIED.lock and .claude/protected-paths.txt of the repo being edited; calls scripts/state state_paths and state_lint]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File hooks/tests/test-state-protected-files-guard.ps1
  - id: state-git-hooks
    script: [hooks/git/pre-commit, hooks/git/post-checkout, hooks/git/post-merge]
    helpers: [hooks/git/state-hook-lib.sh, hooks/git/README.md, hooks/tests/test-state-git-hooks.ps1]
    trigger: git-hook:pre-commit+post-checkout+post-merge (installed per repo with git config core.hooksPath; chains to workstation.chainHooksPath)
    reads: [git config workstation.stateTools workstation.chainHooksPath workstation.stateLint, WORKSTATION_STATE_TOOLS, WORKSTATION_MEMORY_STORE, VERIFIED.lock, the memory store project folder (outside the repo); calls scripts/state state_lint, state_manager and deliverable_lock]
    writes: [STATE-*.md and archives/ in the memory store project folder (outside the repo; never the root STATE.md), removes untracked TASK.md after a merge]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File hooks/tests/test-state-git-hooks.ps1
  - id: no-claude-md
    script: .github/workflows/no-claude-md.yml
    helpers: [scripts/check_no_claude_md.py, scripts/test_check_no_claude_md.py]
    trigger: pr-check
    reads: [the git tree at HEAD]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python3 scripts/check_no_claude_md.py
    check_cmd: python3 scripts/test_check_no_claude_md.py
  - id: plugin-validate
    script: .github/workflows/plugin-validate.yml
    helpers: [scripts/check_cursor_plugin.py, scripts/test_plugin_manifests.py]
    trigger: pr-check
    reads: [.claude-plugin/**, .cursor-plugin/**, skills/**, scripts/check_cursor_plugin.py]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: claude plugin validate .
    check_cmd: python3 scripts/check_cursor_plugin.py
  - id: state-paths
    script: scripts/state/state_paths.py
    helpers: [scripts/state/README.md, scripts/state/tests/test_state_paths.py]
    trigger: manual
    reads: [WORKSTATION_MEMORY_STORE, user .claude memory-link-guard.config.json and settings.json, git metadata of the repo or worktree]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python scripts/state/state_paths.py --json
    check_cmd: python -m unittest discover scripts/state/tests
  - id: state-lint
    script: scripts/state/state_lint.py
    helpers: [scripts/state/state_paths.py, scripts/state/tests/test_state_lint.py]
    trigger: manual
    reads: [STATE.md and STATE-*.md in the memory store project folder (outside the repo)]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python scripts/state/state_lint.py --repo .
    check_cmd: python -m unittest discover scripts/state/tests -p test_state_lint.py
  - id: state-manager
    script: scripts/state/state_manager.py
    helpers: [scripts/state/state_paths.py, scripts/state/state_lint.py, scripts/state/tests/test_state_manager.py]
    trigger: manual
    reads: [the memory store project folder (outside the repo), git metadata]
    writes: [STATE.md and STATE-*.md and BACKLOG.md and archives/ in the memory store project folder (outside the repo)]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python scripts/state/state_manager.py verify --repo .
    check_cmd: python -m unittest discover scripts/state/tests -p test_state_manager.py
  - id: deliverable-lock
    script: scripts/state/deliverable_lock.py
    helpers: [scripts/state/state_paths.py, scripts/state/tests/test_deliverable_lock.py]
    trigger: manual
    reads: [VERIFIED.lock and the locked files of the repo it runs in]
    writes: [VERIFIED.lock at the root of the repo it runs in (lock and unlock only)]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python scripts/state/deliverable_lock.py verify
    check_cmd: python -m unittest discover scripts/state/tests -p test_deliverable_lock.py
  - id: rules-sync
    script: scripts/state/rules_sync.py
    helpers: [scripts/state/state_paths.py, scripts/state/tests/test_rules_sync.py]
    trigger: manual
    reads: [.claude/rules/*.md of the repo it runs in]
    writes: [.cursor/rules/*.mdc of the repo it runs in (generated; not with --check)]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python scripts/state/rules_sync.py --check
    check_cmd: python -m unittest discover scripts/state/tests -p test_rules_sync.py
  - id: move-integrity
    script: scripts/state/move_integrity.py
    helpers: [scripts/state/state_paths.py, scripts/state/tests/test_move_integrity.py]
    trigger: manual
    reads: [the before and after documents, an optional tagging proposal, optional git history]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    check_cmd: python -m unittest discover scripts/state/tests -p test_move_integrity.py
