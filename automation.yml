# automation.yml: every script, hook and job in this repo, grouped by tool (format: skills/git-checker).
# Check it (read-only): python skills/git-checker/hooks/registry-check.py
# state-check only posts a PR comment. Only gen-inventory and gen-code-index write a tracked file by hand.
# trigger: manual | git-hook:<name> | agent-hook:<event> | called-by:<id>. "(inferred)" = read from the code, not run.
# STALE-OUTPUT compares content: an entry whose reads/script were committed after its writes gets its run_cmd
# re-run in a temp copy, and is flagged only if a declared output changes. slow: true (optional, default false)
# marks an expensive generator (or one needing tools CI lacks, the network, or writing outside the repo): it is
# never re-run and keeps the commit-date check. A run_cmd with a <placeholder> or [optional] part also falls back.
generated_patterns: ["**/*.checks.json", "**/*_report.json", "**/*.pdf", "**/*.html", "**/*.xlsx"]
ignore: ["**/tests/**", "**/test_*.py"]
handmade: []
automations:
  - id: state-check
    script: .github/workflows/state-check.yml
    helpers: [.github/state-check.sh, .github/registry-check.py]
    trigger: pr-check
    reads: [PR diff and body, .state-check-mode, automation.yml]
    writes: [PR comment only]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: bash .github/state-check.sh origin/main HEAD
  - id: state-files-gate
    script: .github/workflows/state-files-gate.yml
    helpers: [.github/state-files-gate.sh, skills/git-checker/hooks/state-files-gate.sh, skills/git-checker/hooks/state-files-gate.yml, scripts/test_state_files_gate.py]
    trigger: pr-check
    reads: [the git tree of the PR merge ref]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: bash .github/state-files-gate.sh HEAD
    check_cmd: python3 scripts/test_state_files_gate.py
  - id: hook-pre-commit
    script: .githooks/pre-commit
    helpers: [scripts/guard-staged.sh, scripts/run-gitleaks.sh]
    trigger: git-hook:pre-commit
    reads: [staged changes, .gitleaks-version, .gitleaks.toml, .tools/gitleaks]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: sh .githooks/pre-commit
  - id: hook-pre-merge-commit
    script: .githooks/pre-merge-commit
    helpers: [scripts/guard-staged.sh, scripts/run-gitleaks.sh]
    trigger: git-hook:pre-merge-commit
    reads: [staged changes, .gitleaks-version, .gitleaks.toml, .tools/gitleaks]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
  - id: setup
    script: [setup.ps1, setup.sh]
    helpers: [scripts/fetch-gitleaks.sh]
    trigger: manual
    reads: [.gitleaks-version, pyproject.toml, uv.lock, local.toml.example]
    writes: [.tools/**, .venv/**, local.toml, git config core.hooksPath]
    committed: gitignored
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1
  - id: gen-inventory
    script: scripts/gen-inventory.py
    trigger: manual
    reads: [workstation.lock.yaml]
    writes: [INVENTORY.md]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: .venv/bin/python scripts/gen-inventory.py
  - id: gen-code-index
    script: scripts/gen-code-index.py
    helpers: [scripts/test_gen_code_index.py]
    trigger: manual
    reads: ["**/*.ps1", "**/*.psm1", "**/*.py", "**/*.sh", "**/*.cmd", "**/*.bat"]
    writes: [CODE-INDEX.md]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python3 scripts/gen-code-index.py
    check_cmd: python3 scripts/test_gen_code_index.py
  - id: code-index
    script: .github/workflows/code-index.yml
    trigger: pr-check
    reads: [CODE-INDEX.md, the git tree at HEAD]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python3 scripts/gen-code-index.py --check
    check_cmd: python3 scripts/test_gen_code_index.py
  - id: install
    script: install.ps1
    helpers: [preflight.ps1, ownership-notes.ps1, link-skills.ps1, workstation/make-shortcuts.ps1, install.cmd, claude/claude-setup.ps1, claude/mcp-servers.json, claude/plugins.json, cleanup-legacy.ps1, scripts/test_install_link_skills.py, workstation/health/claude-ai-plugin.ps1, scripts/install-catalog-plugin.ps1, scripts/paste-instructions.ps1, scripts/test_install_catalog.py]
    trigger: manual
    reads: [toolkit.psd1, memory/templates/**, instructions/**, handoff/**, memory/hooks/**, skills/**, claude/**]
    writes: [outside the repo (inferred) - LOCALAPPDATA Workstation folder, user .claude settings and hooks, user .claude.json MCP servers, Projects _claude store, manual shortcuts/*.lnk]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -WhatIf
  - id: install-plugins
    script: install-plugins.ps1
    helpers: [install-plugins.cmd, INSTALL.md, .claude-plugin/marketplace.json, scripts/test_install_plugins.py, workstation/health/claude-ai-plugin.ps1]
    trigger: manual
    reads: [.claude-plugin/marketplace.json]
    writes: [outside the repo (inferred) - opens the claude.ai Plugins page when you run it, and copies workstation-core into the user Cursor local plugins folder]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File install-plugins.ps1 -WhatIf
  - id: setup-guide
    script: scripts/setup_guide.py
    helpers: [scripts/setup_phases.py, scripts/setup_verify.py, SETUP-PROMPT.txt, scripts/test_setup_guide.py]
    trigger: manual
    reads: [scripts/setup_phases.py]
    writes: [outside the repo (inferred) - per-PC setup phase log, not committed]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python3 scripts/setup_guide.py
  - id: repo-profile
    script: scripts/repo_profile.py
    helpers: [scripts/test_repo_profile.py, repo-profile.json]
    trigger: manual
    reads: [the repo tree]
    writes: [repo-profile.json]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python3 scripts/repo_profile.py scan
  - id: uninstall
    script: uninstall.ps1
    trigger: manual
    reads: [Projects _claude automation-installed-files.txt]
    writes: [removes only what install.ps1 recorded]
    committed: no
    auto_commit: false
    enabled: true
  - id: memory-link-guard
    script: memory/hooks/memory-link-guard.ps1
    helpers: [memory/hooks/tests/test-memory-link-guard-progress.ps1, memory/hooks/tests/test-memory-link-guard-worktree.ps1, memory/hooks/tests/test-memory-link-guard-cursor.ps1, hooks/tests/test-state-memory-link-guard.ps1]
    trigger: agent-hook:SessionStart+PreToolUse (installed copy, by install)
    reads: [WORKSTATION_MEMORY_STORE, user .claude settings, autoMemoryDirectory junction]
    writes: [autoMemoryDirectory junction and project memory folders (outside the repo)]
    committed: no
    auto_commit: false
    enabled: true
  - id: handoff-hooks
    script: [handoff/claude/context-guard.ps1, handoff/claude/pr-closeout-nudge.ps1, handoff/cursor/handoff-at-80.py]
    helpers: [handoff/claude/tests/test-pr-closeout-nudge.ps1, handoff/claude/tests/test-state-closeout-trigger.ps1]
    trigger: agent-hook:statusLine+Stop+PreCompact+PostToolUse (installed copies, by install)
    reads: [agent session context usage; PostToolUse payload for pr-closeout-nudge]
    writes: [handoff backups outside the repo (inferred); no files for pr-closeout-nudge]
    committed: no
    auto_commit: false
    enabled: true
  - id: claude-setup
    script: claude/claude-setup.ps1
    helpers: [claude/mcp-servers.json, claude/plugins.json, claude/tests/test-claude-setup.ps1]
    trigger: called-by:install
    reads: [claude/mcp-servers.json, claude/plugins.json, user .claude.json, user .claude/settings.json, user .claude/plugins/installed_plugins.json]
    writes: [user .claude.json MCP servers (merge); Claude Code plugins via claude plugin install only when that plugin is not already enabled or installed at user scope]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File claude/tests/test-claude-setup.ps1
  - id: health-check
    script: workstation/health/workstation-status.ps1
    helpers: [workstation/health/workstation-common.ps1, workstation/health/claude-auth-status.ps1, workstation/health/orphans.ps1, workstation/health/tests/test-claude-auth-status.ps1, workstation/health/tests/test-app-locks.ps1, workstation/health/tests/test-health-clean.ps1, workstation/cursor-worker/cursor-worker-lib.ps1, workstation/paths.ps1, workstation/repo-status.ps1, workstation/repo-branch.ps1]
    trigger: manual
    reads: [LOCALAPPDATA Workstation workstation.json, user .claude settings, skill links, app-lock rule files]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File workstation/health/workstation-status.ps1 -NoPause
  - id: dc-remote
    script: [workstation/desktop-commander-remote/start-dc-remote.ps1, workstation/desktop-commander-remote/stop-dc-remote.ps1, workstation/desktop-commander-remote/dc-remote-status.ps1]
    helpers: [workstation/desktop-commander-remote/dc-remote-lib.ps1, workstation/desktop-commander-remote/tests/test-dc-remote.ps1, workstation/kill-orphans.ps1]
    trigger: manual
    reads: [running Desktop Commander remote processes]
    writes: [LOCALAPPDATA Workstation desktop-commander-remote logs, LOCALAPPDATA Workstation kill-orphans.log]
    committed: no
    auto_commit: false
    enabled: true
  - id: cursor-worker
    script: [workstation/cursor-worker/start-cursor-worker.ps1, workstation/cursor-worker/stop-cursor-worker.ps1]
    helpers: [workstation/cursor-worker/cursor-worker-lib.ps1, workstation/cursor-worker/tests/test-cursor-worker.ps1]
    trigger: manual
    reads: [folders in the detected Projects active directory, Cursor CLI on PATH, processes this tool started]
    writes: [LOCALAPPDATA Workstation cursor-worker logs and instance notes]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File workstation/cursor-worker/tests/test-cursor-worker.ps1
  - id: cleanup-legacy
    script: cleanup-legacy.ps1
    trigger: manual
    reads: [user .claude settings.json, LOCALAPPDATA Workstation old runtime folders, clone shortcuts folder]
    writes: [LOCALAPPDATA Workstation backups/cleanup-legacy archive and HASHES.txt]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File cleanup-legacy.ps1 -WhatIf
  - id: skill-tools
    script: [skills/git-checker/git-checker.ps1, skills/git-checker/git-checker.sh, skills/git-checker/hooks/registry-check.py, skills/git-checker/hooks/state-check.sh, skills/iterative-cleaning/refcheck.py]
    trigger: manual
    reads: [the repo they are run in (read-only)]
    writes: [report to the console; registry-check --set edits automation.yml]
    committed: no
    auto_commit: false
    enabled: true
  - id: app-lock
    script: workstation/app-lock/app-lock.ps1
    helpers: [workstation/app-lock/tests/test-harness-lock.ps1, workstation/app-lock/tests/test-fusion-desktop-lock.ps1, workstation/paths.ps1]
    trigger: manual
    reads: [LOCALAPPDATA Workstation harness-design.lock (-Name harness-design), harness.design.exe window titles, LOCALAPPDATA Workstation fusion-desktop.lock (-Name fusion-desktop), whether Fusion360.exe runs]
    writes: [LOCALAPPDATA Workstation harness-design.lock and harness-design-lock.log when -Name harness-design; fusion-desktop.lock and fusion-desktop-lock.log when -Name fusion-desktop; hidden pinger process (acquire -StartPinger)]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File workstation/app-lock/app-lock.ps1 status -Name harness-design
  - id: check-upstream
    script: workstation/check-upstream.ps1
    helpers: [.github/workflows/check-upstream.yml, workstation/tests/test-check-upstream.ps1]
    trigger: manual
    reads: [skills/**]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File workstation/check-upstream.ps1 -WhatIf
  - id: projects-root-hooks
    script: [hooks/projects-root-guard.ps1, hooks/projects-root-report.ps1]
    helpers: [hooks/projects-root-common.ps1, hooks/tests/test-projects-root-guard.ps1, hooks/hooks.json, hooks/cursor-hooks.json]
    trigger: agent-hook:PreToolUse+Stop (Claude hooks/hooks.json; Cursor hooks/cursor-hooks.json)
    reads: [tool payload on stdin, WORKSTATION_PROJECTS_ROOT, WORKSTATION_PROJECTS_DENY_KEYWORDS, the detected projects root]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File hooks/tests/test-projects-root-guard.ps1
  - id: agents-md-only-warn
    script: hooks/agents-md-only-warn.ps1
    helpers: [hooks/tests/test-agents-md-only-warn.ps1, hooks/hooks.json]
    trigger: agent-hook:SessionStart (Claude hooks/hooks.json only; no Cursor hook, pending decision C1)
    reads: [session cwd from stdin, parent directories up to the drive root]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File hooks/tests/test-agents-md-only-warn.ps1
  - id: rules-inject
    script: hooks/rules-inject.ps1
    helpers: [hooks/state-common.ps1, hooks/hooks.json, hooks/cursor-hooks.json, hooks/tests/test-rules-inject.ps1, memory/templates/claude-global-memory-section.md, memory/templates/claude-shared-memory.mdc, memory/templates/app-locks.md]
    trigger: agent-hook:SessionStart (Claude hooks/hooks.json via hooks/run-ps.sh; Cursor hooks/cursor-hooks.json sessionStart)
    reads: [hook payload on stdin, WORKSTATION_PROJECTS_ROOT or LOCALAPPDATA Workstation workstation.json (projectsRoot), memory/templates in the plugin, the user's ~/.claude/CLAUDE.md and ~/.cursor/rules files (only to skip a block already there)]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File hooks/tests/test-rules-inject.ps1
  - id: subagent-rules
    script: hooks/subagent-rules.ps1
    helpers: [hooks/state-common.ps1, hooks/hooks.json, hooks/tests/test-subagent-rules.ps1]
    trigger: agent-hook:SubagentStart (Claude hooks/hooks.json via hooks/run-ps.sh; no Cursor hook, subagentStart can only allow or deny)
    reads: [hook payload on stdin]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File hooks/tests/test-subagent-rules.ps1
  - id: state-hooks
    script: [hooks/state-inject.ps1, hooks/state-lint-stop.ps1, hooks/protected-files-guard.ps1, hooks/sot-after-edit.ps1]
    helpers: [hooks/state-common.ps1, hooks/hooks.json, hooks/cursor-hooks.json, hooks/tests/state-test-support.ps1, hooks/tests/test-state-inject.ps1, hooks/tests/test-state-lint-stop.ps1, hooks/tests/test-state-protected-files-guard.ps1, hooks/tests/test-state-sot-hooks.ps1]
    trigger: agent-hook:SessionStart+Stop+PreToolUse+PostToolUse (Claude hooks/hooks.json via hooks/run-ps.sh; Cursor hooks/cursor-hooks.json sessionStart+preToolUse+postToolUse+beforeShellExecution+stop)
    reads: [hook payload on stdin, WORKSTATION_STATE_TOOLS, STATE.md and STATE-*.md at the root of the repo or worktree being edited (and its sibling worktrees), SPEC files, VERIFIED.lock, .claude/protected-paths.txt and .claude/sot.json of the repo being edited; calls scripts/state state_paths, state_lint and sot_guard (sot-after-edit runs the registry's fast checks)]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File hooks/tests/test-state-protected-files-guard.ps1
  - id: state-git-hooks
    script: [hooks/git/pre-commit, hooks/git/post-checkout, hooks/git/post-merge]
    helpers: [hooks/git/state-hook-lib.sh, hooks/git/README.md, hooks/tests/test-state-git-hooks.ps1, hooks/tests/test-state-sot-hooks.ps1]
    trigger: git-hook:pre-commit+post-checkout+post-merge (installed per repo with git config core.hooksPath; chains to workstation.chainHooksPath)
    reads: [git config workstation.stateTools workstation.chainHooksPath workstation.stateLint, WORKSTATION_STATE_TOOLS, VERIFIED.lock, .claude/sot.json and the checks it lists, STATE.md and STATE-*.md at the worktree root; calls scripts/state state_lint, state_manager, deliverable_lock and sot_guard]
    writes: [an untracked STATE-<slug>.md at the worktree root on a new branch checkout (post-checkout; never the root STATE.md), removes untracked TASK.md after a merge; post-merge only warns about a STATE-*.md left on the trunk]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File hooks/tests/test-state-git-hooks.ps1
  - id: hook-launcher
    script: [hooks/run-ps.sh, hooks/rules_fallback.py]
    helpers: [hooks/README.md, hooks/hooks.json, scripts/test_run_ps_launcher.py, hooks/subagent-rules.ps1, memory/templates/claude-global-memory-section.md, memory/templates/app-locks.md, scripts/state/state_paths.py]
    trigger: called-by:state-hooks (every Claude hooks/hooks.json command runs through it; rules_fallback.py only on SessionStart or SubagentStart when powershell and pwsh are both missing)
    reads: [PATH (powershell, else pwsh, else python3 or python); hook payload hook_event_name, session_id and cwd when both are missing; the same templates, ~/.claude/CLAUDE.md, WORKSTATION_PROJECTS_ROOT and STATE files as rules-inject and state-inject]
    writes: ['an empty marker file TMPDIR/workstation-rules-warned-<session_id>-<event> (TMPDIR defaults to /tmp) when the no-PowerShell warning is shown, once per session and event']
    committed: no
    auto_commit: false
    enabled: true
    check_cmd: python -m pytest -q scripts/test_run_ps_launcher.py
  - id: registry-check-test
    script: .github/workflows/registry-check-test.yml
    helpers: [scripts/test_registry_check.py]
    trigger: pr-check
    reads: [skills/git-checker/hooks/registry-check.py, .github/registry-check.py]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python3 scripts/test_registry_check.py
    check_cmd: python3 scripts/test_registry_check.py
  - id: no-claude-md
    script: .github/workflows/no-claude-md.yml
    helpers: [scripts/check_no_claude_md.py, scripts/test_check_no_claude_md.py]
    trigger: pr-check
    reads: [the git tree at HEAD]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python3 scripts/check_no_claude_md.py
    check_cmd: python3 scripts/test_check_no_claude_md.py
  - id: plugin-validate
    script: .github/workflows/plugin-validate.yml
    helpers: [scripts/check_cursor_plugin.py, scripts/test_plugin_manifests.py, scripts/test_run_ps_launcher.py, rules/sot-permission.mdc]
    trigger: pr-check
    reads: [.claude-plugin/**, .cursor-plugin/**, rules/**, skills/**, hooks/hooks.json, hooks/run-ps.sh, scripts/check_cursor_plugin.py]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: claude plugin validate .
    check_cmd: python3 scripts/check_cursor_plugin.py
  - id: state-paths
    script: scripts/state/state_paths.py
    helpers: [scripts/state/README.md, scripts/state/tests/test_state_paths.py]
    trigger: manual
    reads: [git metadata of the repo or worktree (state folder = worktree root); WORKSTATION_MEMORY_STORE, user .claude memory-link-guard.config.json and settings.json (notes store only)]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python scripts/state/state_paths.py --json
    check_cmd: python -m unittest discover scripts/state/tests
  - id: state-lint
    script: scripts/state/state_lint.py
    helpers: [scripts/state/state_paths.py, scripts/state/tests/test_state_lint.py]
    trigger: manual
    reads: [STATE.md and STATE-*.md at the root of the repo or worktree]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python scripts/state/state_lint.py --repo .
    check_cmd: python -m unittest discover scripts/state/tests -p test_state_lint.py
  - id: state-manager
    script: scripts/state/state_manager.py
    helpers: [scripts/state/state_paths.py, scripts/state/state_lint.py, scripts/state/tests/test_state_manager.py]
    trigger: manual
    reads: [STATE.md, STATE-*.md and BACKLOG.md at the worktree root, git refs (git fetch --prune; git show origin/<branch>:STATE-<slug>.md) and git worktree list for branches]
    writes: [STATE.md, STATE-<slug>.md, BACKLOG.md and archives/ at the worktree root (init, new-branch); git mv of STATE-<slug>.md into archives/ (archive-branch, staged, never committed by the tool)]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python scripts/state/state_manager.py verify --repo .
    check_cmd: python -m unittest discover scripts/state/tests -p test_state_manager.py
  - id: deliverable-lock
    script: scripts/state/deliverable_lock.py
    helpers: [scripts/state/state_paths.py, scripts/state/tests/test_deliverable_lock.py]
    trigger: manual
    reads: [VERIFIED.lock and the locked files of the repo it runs in]
    writes: [VERIFIED.lock at the root of the repo it runs in (lock and unlock only)]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python scripts/state/deliverable_lock.py verify
    check_cmd: python -m unittest discover scripts/state/tests -p test_deliverable_lock.py
  - id: rules-sync
    script: scripts/state/rules_sync.py
    helpers: [scripts/state/state_paths.py, scripts/state/tests/test_rules_sync.py]
    trigger: manual
    reads: [.claude/rules/*.md of the repo it runs in]
    writes: [.cursor/rules/*.mdc of the repo it runs in (generated ones only; never a hand-made .mdc; not with --check; nothing when the repo has no .claude/rules)]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python scripts/state/rules_sync.py --check
    check_cmd: python -m unittest discover scripts/state/tests -p test_rules_sync.py
  - id: sot-guard
    script: scripts/state/sot_guard.py
    helpers: [scripts/state/README.md, scripts/state/tests/test_sot_guard.py]
    trigger: called-by:state-hooks+state-git-hooks (also manual; lint-registry from iterative-cleaning)
    reads: [.claude/sot.json, the SoT files and git HEAD / merge-base; runs the commands the registry lists]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: python scripts/state/sot_guard.py lint-registry
    check_cmd: python -m unittest discover scripts/state/tests -p test_sot_guard.py
  - id: move-integrity
    script: scripts/state/move_integrity.py
    helpers: [scripts/state/state_paths.py, scripts/state/tests/test_move_integrity.py]
    trigger: manual
    reads: [the before and after documents, an optional tagging proposal, optional git history]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    check_cmd: python -m unittest discover scripts/state/tests -p test_move_integrity.py
  - id: repo-tests
    script: .github/workflows/repo-tests.yml
