# automation.yml: every script, hook and job in this repo, grouped by tool (format: skills/git-checker).
# Check it (read-only): python skills/git-checker/hooks/registry-check.py
# state-check only posts a PR comment. pack-skill-zips auto-commits skills/*.zip onto PR
# branches (never main, never if PR head is main; if main is stale it resets chore/skill-zips
# and force-with-lease that bot branch only). Only gen-inventory writes a tracked file by hand.
# trigger: manual | git-hook:<name> | agent-hook:<event> | called-by:<id>. "(inferred)" = read from the code, not run.
generated_patterns: ["**/*.checks.json", "**/*_report.json", "**/*.pdf", "**/*.html", "**/*.xlsx", "skills/*.zip"]
ignore: ["**/tests/**", "**/test_*.py"]
handmade: []
automations:
  - id: state-check
    script: .github/workflows/state-check.yml
    helpers: [.github/state-check.sh, .github/registry-check.py]
    trigger: pr-check
    reads: [PR diff and body, .state-check-mode, automation.yml]
    writes: [PR comment only]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: bash .github/state-check.sh origin/main HEAD
  - id: hook-pre-commit
    script: .githooks/pre-commit
    helpers: [scripts/guard-staged.sh, scripts/run-gitleaks.sh]
    trigger: git-hook:pre-commit
    reads: [staged changes, .gitleaks-version, .gitleaks.toml, .tools/gitleaks]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: sh .githooks/pre-commit
  - id: hook-pre-merge-commit
    script: .githooks/pre-merge-commit
    helpers: [scripts/guard-staged.sh, scripts/run-gitleaks.sh]
    trigger: git-hook:pre-merge-commit
    reads: [staged changes, .gitleaks-version, .gitleaks.toml, .tools/gitleaks]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
  - id: setup
    script: [setup.ps1, setup.sh]
    helpers: [scripts/fetch-gitleaks.sh]
    trigger: manual
    reads: [.gitleaks-version, pyproject.toml, uv.lock, local.toml.example]
    writes: [.tools/**, .venv/**, local.toml, git config core.hooksPath]
    committed: gitignored
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1
  - id: gen-inventory
    script: scripts/gen-inventory.py
    trigger: manual
    reads: [workstation.lock.yaml]
    writes: [INVENTORY.md]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: .venv/bin/python scripts/gen-inventory.py
  - id: install
    script: install.ps1
    helpers: [preflight.ps1, ownership-notes.ps1, link-skills.ps1, workstation/make-shortcuts.ps1, install.cmd, claude/claude-setup.ps1, claude/mcp-servers.json, claude/plugins.json, cleanup-legacy.ps1]
    trigger: manual
    reads: [toolkit.psd1, memory/templates/**, instructions/**, handoff/**, memory/hooks/**, skills/**, claude/**]
    writes: [outside the repo (inferred) - LOCALAPPDATA Workstation folder, user .claude settings and hooks, user .claude.json MCP servers, Projects _claude store, manual shortcuts/*.lnk]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -WhatIf
  - id: uninstall
    script: uninstall.ps1
    trigger: manual
    reads: [Projects _claude automation-installed-files.txt]
    writes: [removes only what install.ps1 recorded]
    committed: no
    auto_commit: false
    enabled: true
  - id: memory-link-guard
    script: memory/hooks/memory-link-guard.ps1
    helpers: [memory/hooks/tests/test-memory-link-guard-progress.ps1, memory/hooks/tests/test-memory-link-guard-worktree.ps1, memory/hooks/tests/test-memory-link-guard-cursor.ps1]
    trigger: agent-hook:SessionStart+PreToolUse (installed copy, by install)
    reads: [user .claude settings, autoMemoryDirectory junction]
    writes: [autoMemoryDirectory junction and project memory folders (outside the repo)]
    committed: no
    auto_commit: false
    enabled: true
  - id: handoff-hooks
    script: [handoff/claude/context-guard.ps1, handoff/claude/pr-closeout-nudge.ps1, handoff/cursor/handoff-at-80.py]
    helpers: [handoff/claude/tests/test-pr-closeout-nudge.ps1]
    trigger: agent-hook:statusLine+Stop+PreCompact+PostToolUse (installed copies, by install)
    reads: [agent session context usage; PostToolUse payload for pr-closeout-nudge]
    writes: [handoff backups outside the repo (inferred); no files for pr-closeout-nudge]
    committed: no
    auto_commit: false
    enabled: true
  - id: claude-setup
    script: claude/claude-setup.ps1
    helpers: [claude/mcp-servers.json, claude/plugins.json, claude/tests/test-claude-setup.ps1]
    trigger: called-by:install
    reads: [claude/mcp-servers.json, claude/plugins.json, user .claude.json]
    writes: [user .claude.json MCP servers (merge); Claude Code plugins via claude plugin install]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File claude/tests/test-claude-setup.ps1
  - id: health-check
    script: workstation/health/workstation-status.ps1
    helpers: [workstation/health/workstation-common.ps1, workstation/health/claude-auth-status.ps1, workstation/health/orphans.ps1, workstation/health/tests/test-claude-auth-status.ps1, workstation/health/tests/test-app-locks.ps1, workstation/paths.ps1, workstation/repo-status.ps1, workstation/repo-branch.ps1]
    trigger: manual
    reads: [LOCALAPPDATA Workstation workstation.json, user .claude settings, skill links, app-lock rule files]
    writes: []
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File workstation/health/workstation-status.ps1 -NoPause
  - id: dc-remote
    script: [workstation/desktop-commander-remote/start-dc-remote.ps1, workstation/desktop-commander-remote/stop-dc-remote.ps1, workstation/desktop-commander-remote/dc-remote-status.ps1]
    helpers: [workstation/desktop-commander-remote/dc-remote-lib.ps1, workstation/desktop-commander-remote/tests/test-dc-remote.ps1, workstation/kill-orphans.ps1]
    trigger: manual
    reads: [running Desktop Commander remote processes]
    writes: [LOCALAPPDATA Workstation desktop-commander-remote logs, LOCALAPPDATA Workstation kill-orphans.log]
    committed: no
    auto_commit: false
    enabled: true
  - id: cleanup-legacy
    script: cleanup-legacy.ps1
    trigger: manual
    reads: [user .claude settings.json, LOCALAPPDATA Workstation old runtime folders, clone shortcuts folder]
    writes: [LOCALAPPDATA Workstation backups/cleanup-legacy archive and HASHES.txt]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File cleanup-legacy.ps1 -WhatIf
  - id: skill-tools
    script: [skills/git-checker/git-checker.ps1, skills/git-checker/git-checker.sh, skills/git-checker/hooks/registry-check.py, skills/git-checker/hooks/state-check.sh, skills/iterative-cleaning/refcheck.py]
    trigger: manual
    reads: [the repo they are run in (read-only)]
    writes: [report to the console; registry-check --set edits automation.yml]
    committed: no
    auto_commit: false
    enabled: true
  - id: fusion-lock
    script: workstation/fusion-lock/fusion-lock.ps1
    helpers: [workstation/fusion-lock/tests/test-fusion-lock.ps1, workstation/fusion-lock/tests/test-harness-lock.ps1, workstation/paths.ps1]
    trigger: manual
    reads: [LOCALAPPDATA Workstation fusion.lock (default) or harness-design.lock (-Name harness-design), AutodeskFusionMCP add-in at 127.0.0.1:8765 (Fusion check only), harness.design.exe window titles (harness.design check only)]
    writes: [LOCALAPPDATA Workstation fusion.lock and fusion-lock.log by default; harness-design.lock and harness-design-lock.log when -Name harness-design; hidden pinger process (acquire -StartPinger)]
    committed: no
    auto_commit: false
    enabled: true
    run_cmd: powershell -NoProfile -ExecutionPolicy Bypass -File workstation/fusion-lock/fusion-lock.ps1 status
  - id: pack-skill-zips
    script: .github/workflows/pack-skill-zips.yml
    helpers: [scripts/pack-skill-zips.py, scripts/pack-skill-zips.sh, scripts/pack-skill-zips.ps1, scripts/pack-skill-zips-commit.sh, scripts/guard-staged.sh, scripts/fetch-gitleaks.sh, scripts/run-gitleaks.sh]
    trigger: pr-check
    reads: [skills/**, scripts/pack-skill-zips.py]
    writes: [skills/*.zip]
    committed: yes
    auto_commit: true
    enabled: true
    run_cmd: python3 scripts/pack-skill-zips.py --strict
